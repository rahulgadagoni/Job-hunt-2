name: Job Hunt Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows manual trigger button

jobs:
  sync_jobs:
    runs-on: ubuntu-latest
    permissions:          # CRITICAL: Grants permission to write to the repo
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Email Sync Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: python scripts/email_metadata_tracker.py
