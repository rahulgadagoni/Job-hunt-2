name: Sync Job Application Context

on:
  schedule:
    # Runs daily at 13:00 UTC. Adjust to taste (cron uses UTC, not local time).
    - cron: '0 13 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  id-token: write  # required for GCP Workload Identity Federation (no static key needed)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # --- GCP auth (only needed if the DB is a Cloud SQL private-IP instance) ---
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}" &
          # give the proxy a moment to establish the tunnel before the script connects
          sleep 5

      - name: Run job context sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}          # e.g. postgresql://user:pass@127.0.0.1:5432/dbname
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}          # optional, defaults to INBOX
          SYNC_SINCE_DAYS: '60'
          JOB_EMAIL_SUBJECT_FILTER: ${{ secrets.JOB_EMAIL_SUBJECT_FILTER }}  # optional
        run: python scripts/transfer_job_context.py
